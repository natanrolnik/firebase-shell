name: Release Firebase xcframeworks

# Repackages a given Firebase.zip release into one zip per xcframework,
# uploads them as release assets, and commits the regenerated Package.swift.
on:
  workflow_dispatch:
    inputs:
      firebase_version:
        description: "Firebase version (firebase-ios-sdk release tag), e.g. 12.14.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The default Xcode on the macos-15 image provides a Swift toolchain new
      # enough for `swift package compute-checksum` (it only hashes the zip).
      - name: Show Swift
        run: xcrun swift --version

      # Step order matters: regenerate + commit + push Package.swift FIRST, then
      # cut the release tag on that exact commit, then upload the same dist/ zips.
      # Otherwise the tag points at a commit whose Package.swift has stale
      # checksums and `swift package resolve` fails for consumers.
      - name: Repackage + checksum + regenerate Package.swift
        run: Scripts/make-release.sh "${{ inputs.firebase_version }}"

      - name: Commit + push regenerated Package.swift
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Package.swift; then
            git add Package.swift
            git commit -m "Firebase ${{ inputs.firebase_version }}: regenerate binaryTargets"
            git push
          fi

      - name: Create release on the pushed commit + upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.firebase_version }}"
          SHA="$(git rev-parse HEAD)"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$SHA" --title "Firebase $VERSION" \
              --notes "Per-xcframework repackaging of Firebase $VERSION (firebase-ios-sdk)."
          fi
          gh release upload "$VERSION" dist/*.xcframework.zip --clobber
